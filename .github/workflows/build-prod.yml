name: Build and release prod apps

on:
  push:
    tags:
      - 'v*'
      # Testing tags (vX.Y.Z-testing.N) are released by build-testing.yml
      - '!v*-*'

jobs:
  release:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: macos-latest
            arch: x64
          - os: macos-latest
            arch: arm64
          - os: ubuntu-latest
            arch: x64
          - os: windows-latest
            arch: x64

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Prepare for app notarization
        if: startsWith(matrix.os, 'macos')
        # Import Apple API key for app notarization on macOS
        run: |
          mkdir -p ~/private_keys/
          echo '${{ secrets.api_key }}' > ~/private_keys/AuthKey_${{ secrets.api_key_id }}.p8
          xcrun --find notarytool

      - name: Install Linux build dependencies (libuiohook/X11)
        if: matrix.os == 'ubuntu-latest'
        # uiohook-napi is rebuilt from source against Electron's ABI and needs
        # the X11 dev headers to compile libuiohook. Packages match the
        # libraries linked in uiohook-napi's binding.gyp: -lX11 -lXrandr -lXtst -lXt
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxtst-dev libxt-dev

      # macOS notarization and Azure signing fail now and then on network
      # errors (connect timeout, DNS): every build step is attempted twice.
      - name: Build/release Electron app (macOS/Linux)
        id: build
        if: "!startsWith(matrix.os, 'windows')"
        continue-on-error: true
        uses: samuelmeuli/action-electron-builder@v1
        with:
          # GitHub token, automatically provided to the action
          # (No need to define this secret in the repo settings)
          github_token: ${{ secrets.github_token }}

          # If the commit is tagged with a version (e.g. "v1.0.0"),
          # release the app after building
          release: ${{ startsWith(github.ref, 'refs/tags/v') }}

          # macOS certificate files
          mac_certs: ${{ secrets.mac_certs }}
          mac_certs_password: ${{ secrets.mac_certs_psw }}

          # Pass arch here
          args: --${{ matrix.arch }}
        env:
          # macOS notarization API key
          APPLE_ID: ${{ secrets.apple_id }}
          APPLE_ID_PASSWORD: ${{ secrets.apple_id_password }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.apple_id_password }}
          APPLE_TEAM_ID: 8D66VDADVH
          DEBUG: electron-notarize*

      - name: Build/release Electron app (macOS/Linux, retry)
        if: "!startsWith(matrix.os, 'windows') && steps.build.outcome == 'failure'"
        uses: samuelmeuli/action-electron-builder@v1
        with:
          # GitHub token, automatically provided to the action
          # (No need to define this secret in the repo settings)
          github_token: ${{ secrets.github_token }}

          # If the commit is tagged with a version (e.g. "v1.0.0"),
          # release the app after building
          release: ${{ startsWith(github.ref, 'refs/tags/v') }}

          # macOS certificate files
          mac_certs: ${{ secrets.mac_certs }}
          mac_certs_password: ${{ secrets.mac_certs_psw }}

          # Pass arch here
          args: --${{ matrix.arch }}
        env:
          # macOS notarization API key
          APPLE_ID: ${{ secrets.apple_id }}
          APPLE_ID_PASSWORD: ${{ secrets.apple_id_password }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.apple_id_password }}
          APPLE_TEAM_ID: 8D66VDADVH
          DEBUG: electron-notarize*

      - name: Archive notorization logs
        if: always() && startsWith(matrix.os, 'macos')
        uses: actions/upload-artifact@v7
        with:
          name: notarization-logs-${{ matrix.arch }}
          path: notarization-error.log
          if-no-files-found: ignore

      # --- Windows: build with the release config (electron-builder signs every
      # binary via Azure Trusted Signing during packaging), then upload ---
      - name: Render Windows signing config from secrets
        if: startsWith(matrix.os, 'windows')
        shell: bash
        env:
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
        # electron-builder does NOT expand ${env.*} inside azureSignOptions, so
        # the endpoint/account/profile must be written as literal values. Inject
        # them here from secrets (keeps them out of the repo).
        run: |
          cat > electron-builder.release.yml <<EOF
          extends: ./electron-builder.yml
          win:
            azureSignOptions:
              publisherName: 'Nethesis Srl'
              endpoint: '${AZURE_SIGNING_ENDPOINT}'
              codeSigningAccountName: '${AZURE_SIGNING_ACCOUNT}'
              certificateProfileName: '${AZURE_CERT_PROFILE}'
              timestampRfc3161: http://timestamp.acs.microsoft.com
              timestampDigest: SHA256
          EOF

      - name: Build Electron app (Windows)
        id: build-win
        if: startsWith(matrix.os, 'windows')
        continue-on-error: true
        uses: samuelmeuli/action-electron-builder@v1
        with:
          github_token: ${{ secrets.github_token }}
          release: false
          # Use the release config so azureSignOptions is applied (dev/local
          # builds use electron-builder.yml and stay unsigned).
          args: --${{ matrix.arch }} --config electron-builder.release.yml
        env:
          # Consumed by electron-builder.release.yml's azureSignOptions. Signing
          # inside the build also covers the inner NethLink.exe and the
          # uninstaller, not just the installer.
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}

      - name: Build Electron app (Windows, retry)
        if: startsWith(matrix.os, 'windows') && steps.build-win.outcome == 'failure'
        uses: samuelmeuli/action-electron-builder@v1
        with:
          github_token: ${{ secrets.github_token }}
          release: false
          # Use the release config so azureSignOptions is applied (dev/local
          # builds use electron-builder.yml and stay unsigned).
          args: --${{ matrix.arch }} --config electron-builder.release.yml
        env:
          # Consumed by electron-builder.release.yml's azureSignOptions. Signing
          # inside the build also covers the inner NethLink.exe and the
          # uninstaller, not just the installer.
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}

      - name: Upload signed Windows installer to release
        if: startsWith(matrix.os, 'windows') && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.github_token }}
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          for file in dist/*.exe; do
            gh release upload "$TAG" "$file" --clobber
          done
  update-release-notes:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # The step below needs the previous tag to generate the release
          # notes. The default shallow checkout only fetches the tag being
          # built, so PREV_TAG resolved to the current tag and the notes
          # came out as "compare/vX...vX".
          fetch-depth: 0

      - name: Generate Release Notes between Tags
        env:
          GITHUB_TOKEN: ${{ secrets.github_token }}
        run: |
          # Get the tag being pushed (e.g., v1.0.0)
          TAG=${GITHUB_REF#refs/tags/}

          # Previous tag = the line before $TAG in the version-sorted list of
          # stable tags, so the notes cover everything since the last official
          # release, not just since the last testing build.
          # If $TAG is the first tag, grep -B 1 returns $TAG itself.
          PREV_TAG=$(git tag --sort=v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | grep -x -F -B 1 "$TAG" | head -n 1)

          if [ -z "$PREV_TAG" ] || [ "$PREV_TAG" == "$TAG" ]; then
            echo "Error: Previous tag not found."
            exit 1
          fi

          # Generate the release notes using GitHub API. Keep them in a file:
          # they span many lines, which $GITHUB_OUTPUT rejects without a
          # heredoc delimiter, and interpolating them into a shell command
          # would break on quotes and backticks.
          gh api repos/NethServer/nethlink/releases/generate-notes \
            -f tag_name="$TAG" -f previous_tag_name="$PREV_TAG" -q .body \
            > release-notes.md

      - name: Update Release Notes in GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.github_token }}
        run: |
          # Get the tag being pushed
          TAG=${GITHUB_REF#refs/tags/}

          # Update the release with the generated notes
          gh release edit "$TAG" --title "$TAG" --notes-file release-notes.md

      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: cyclonedx
          output: sbom.cdx.json

      - name: Attach SBOM to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get the tag being pushed
          TAG=${GITHUB_REF#refs/tags/}

          # Update the release with the generated notes
          gh release upload $TAG sbom.cdx.json --clobber

  # Once the official release is complete, the testing pre-releases that led
  # to it (vX.Y.Z-testing.N sorting before this tag) are obsolete: delete
  # them together with their tags.
  clean-testing-releases:
    needs: update-release-notes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Delete obsolete testing releases
        env:
          GH_TOKEN: ${{ secrets.github_token }}
        run: |
          TAG=${GITHUB_REF#refs/tags/}

          # Version-sorted with pre-releases before their release: every
          # testing tag listed before $TAG is older than this release.
          git -c versionsort.suffix=- tag --list 'v*' --sort=v:refname \
            | sed -n "/^${TAG//./\\.}\$/q;p" \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-testing\.[0-9]+$' \
            | while read -r TESTING_TAG; do
                echo "Deleting $TESTING_TAG"
                gh release delete "$TESTING_TAG" --cleanup-tag --yes \
                  || git push origin ":refs/tags/$TESTING_TAG"
              done
